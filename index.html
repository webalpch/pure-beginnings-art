    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Faut-il un visa pour visiter le Cambodge ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, la plupart des voyageurs ont besoin d'un visa touristique pour entrer au Cambodge. Il peut être obtenu en ligne (e-visa) ou à l'arrivée à l'aéroport."
          }
        },
        {
          "@type": "Question",
          "name": "Quelle est la meilleure période pour visiter le Cambodge ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La meilleure période pour voyager au Cambodge s'étend de novembre à mars, pendant la saison sèche. Le climat est plus doux et idéal pour visiter les temples d'Angkor."
          }
        },
        {
          "@type": "Question",
          "name": "Est-il possible d'avoir un guide francophone ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, tous nos circuits sont accompagnés de guides francophones officiels, certifiés par le ministère du Tourisme du Cambodge."
          }
        },
        {
          "@type": "Question",
          "name": "Le transport est-il inclus dans les circuits ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, le transport est inclus : Tuk Tuk, voiture privée, bateau local ou minibus selon le programme choisi. Tous nos véhicules sont confortables et climatisés."
          }
        },
        {
          "@type": "Question",
          "name": "Comment réserver un circuit ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vous pouvez nous contacter directement via le formulaire du site, par WhatsApp au +855 12 929 279 ou par e-mail. Nous vous enverrons une proposition personnalisée et un devis détaillé."
          }
        }
      ]
    }
